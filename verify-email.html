<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified - Rzak</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { color: #4CAF50; margin-bottom: 20px; }
        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message { padding: 12px; border-radius: 8px; margin-top: 16px; }
        .message.error { background: #fee; color: #e74c3c; }
        .message.success { background: #e8f8f0; color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rzak</h1>
        <div id="content">
            <div class="loader"></div>
            <p>Verifying your email...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gzlxybufjrmscsanfpyq.supabase.co';
        
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        function showMessage(msg, type) {
            document.getElementById('content').innerHTML = '<div class="message ' + type + '">' + msg + '</div>';
        }
        
        async function verifyEmail() {
            if (!token) {
                showMessage('Invalid verification link.', 'error');
                return;
            }
            
            try {
                const response = await fetch(SUPABASE_URL + '/functions/v1/verify-email?token=' + token);
                const result = await response.json();
                
                if (response.ok && result.success) {
                    showMessage('Email verified successfully! You can now close this window.', 'success');
                } else {
                    showMessage(result.error || 'Verification failed. The link may have expired.', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            }
        }
        
        verifyEmail();
    </script>
</body>
</html>
