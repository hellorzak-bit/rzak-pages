<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Rzak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 28px;
        }
        h2 {
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
        }
        .message {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
        }
        .message.error {
            background: #fee;
            color: #e74c3c;
        }
        .message.success {
            background: #e8f8f0;
            color: #27ae60;
        }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Rzak</h1>
            <p style="color: #999;">Reset Your Password</p>
        </div>
        
        <div id="status"></div>
        
        <div id="resetForm">
            <div class="input-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter new password">
                    <span class="toggle-password" onclick="togglePassword('newPassword', this)">👁️</span>
                </div>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                    <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁️</span>
                </div>
            </div>
            <button id="resetBtn" onclick="resetPassword()">Reset Password</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gzlxybufjrmscsanfpyq.supabase.co';
        
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        function togglePassword(fieldId, element) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                element.textContent = '🙈';
            } else {
                field.type = 'password';
                element.textContent = '👁️';
            }
        }
        
        function showMessage(msg, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
        }
        
        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            
            document.getElementById('status').innerHTML = '';
            
            if (!newPassword || !confirmPassword) {
                showMessage('Please fill in both fields', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            resetBtn.disabled = true;
            resetBtn.innerHTML = '<span class="loader"></span> Processing...';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/functions/v1/reset-password-confirm`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
    document.getElementById('resetForm').style.display = 'none';
    showMessage('Password reset successfully! You can now close this window and log in to the app.', 'success');
}
                } else {
                    showMessage(result.error || 'Failed to reset password', 'error');
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = 'Reset Password';
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
                resetBtn.disabled = false;
                resetBtn.innerHTML = 'Reset Password';
            }
        }
        
        // Check if token exists
        if (!token) {
            showMessage('Invalid reset link. Please request a new password reset.', 'error');
            document.getElementById('resetForm').style.display = 'none';
        }
    </script>
</body>
</html>
